name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      # Only deploy when update-api-version commits the new version constant.
      # This file is the single file that workflow touches, so it acts as an
      # exact signal that a release has been fully processed.
      - 'cmd/api/main.go'
  workflow_dispatch:   # allows manual trigger from the GitHub Actions UI

env:
  PROJECT_ID: gopherfeed-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/gopherfeed-prod/gopherfeed

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Authenticate to GCP via Workload Identity Federation (no long-lived key)
      # -----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # -----------------------------------------------------------------------
      # Extract the version that update-api-version just committed
      # -----------------------------------------------------------------------
      - name: Extract version from main.go
        id: version
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' cmd/api/main.go)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version $VERSION"

      # -----------------------------------------------------------------------
      # Build frontend then Go binary (mirrors the Dockerfile stages)
      # -----------------------------------------------------------------------
      - name: Build & push API image
        run: |
          IMAGE="${{ env.REGISTRY }}/api:${{ steps.version.outputs.VERSION }}"
          docker build \
            --platform=linux/amd64 \
            --tag "$IMAGE" \
            --tag "${{ env.REGISTRY }}/api:latest" \
            --file Dockerfile \
            .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/api:latest"

      - name: Build & push Worker image
        run: |
          IMAGE="${{ env.REGISTRY }}/worker:${{ steps.version.outputs.VERSION }}"
          docker build \
            --platform=linux/amd64 \
            --tag "$IMAGE" \
            --tag "${{ env.REGISTRY }}/worker:latest" \
            --file Dockerfile.worker \
            .
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/worker:latest"

      # -----------------------------------------------------------------------
      # Deploy
      # -----------------------------------------------------------------------
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy gopherfeed-api \
            --image="${{ env.REGISTRY }}/api:${{ steps.version.outputs.VERSION }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

      - name: Deploy Worker to Cloud Run
        run: |
          gcloud run deploy gopherfeed-worker \
            --image="${{ env.REGISTRY }}/worker:${{ steps.version.outputs.VERSION }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe gopherfeed-api \
            --region=${{ env.REGION }} \
            --format="value(status.url)"
